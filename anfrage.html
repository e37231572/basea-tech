<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Projektanfrage – BaseA Tech</title>

    <meta name="description"
          content="Projektanfrage an BaseA Tech für Elektronik, Mechanik und technische Dokumentation.">

    <meta name="robots" content="index, follow">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="site-header">
    <a href="index.html" class="logo">BaseA Tech</a>

    <nav class="main-nav" aria-label="Hauptnavigation">
        <a href="elektronik.html">Elektronik</a>
        <a href="mechanik.html">Mechanik</a>
        <a href="dokumentation.html">Dokumentation</a>
        <a href="anfrage.html">Projektanfrage</a>
    </nav>
</header>

<main>

    <section class="contact">

        <h1>Projektanfrage</h1>

        <h2>
            Beschreiben Sie kurz Ihre technische Aufgabe.
        </h2>

        <p>
            Teilen Sie uns mit, wobei Sie Unterstützung benötigen.
            Nach Prüfung Ihrer Anfrage können Umfang, Anforderungen
            und weitere Projektschritte abgestimmt werden.
        </p>

        <form class="contact-form"
              action="https://formspree.io/f/mjyvqeoq"
              method="POST">

            <label for="name">Name</label>
            <input type="text"
                   id="name"
                   name="name"
                   placeholder="Ihr Name"
                   required>

            <label for="email">E-Mail</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Ihre E-Mail-Adresse"
                   required>

            <label for="bereich">Projektbereich</label>
            <select id="bereich"
                    name="projektbereich"
                    required>

                <option value="" disabled selected>
                    Bitte auswählen
                </option>

                <option value="Elektronik">Elektronik</option>
                <option value="Mechanik">Mechanik</option>
                <option value="Dokumentation">Dokumentation</option>
                <option value="Kombiniertes Projekt">
                    Kombiniertes Projekt
                </option>

            </select>

            <label for="message">Projektbeschreibung</label>
            <textarea id="message"
                      name="message"
                      rows="7"
                      placeholder="Beschreiben Sie kurz Ihre Aufgabe, vorhandene Unterlagen und das gewünschte Ergebnis."
                      required></textarea>

            <button type="submit" class="contact-button">
                Projektanfrage senden
            </button>

        </form>

    </section>

</main>

</body>

</html>
